services:
  mysql:
    image: mysql:8.0
    container_name: mysql-sgcs
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: sgcs_santa_rita
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: sgcs-app
    environment:
      DB_URL: jdbc:mysql://mysql:3306/sgcs_santa_rita
      DB_USERNAME: root
      DB_PASSWORD: root123
      JWT_SECRET: ${JWT_SECRET:-sgcs-development-secret-key-change-production}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-PT8H}
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
