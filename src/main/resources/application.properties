spring.application.name=sgcs

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/sgcs_santa_rita}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root123}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jackson.deserialization.fail-on-unknown-properties=true

security.jwt.secret=${JWT_SECRET:sgcs-development-secret-key-change-production}
security.jwt.expiration=${JWT_EXPIRATION:PT8H}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
